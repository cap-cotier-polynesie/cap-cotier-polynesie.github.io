name: Déploiement GitHub Pages & Cache-Busting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Application du stamp de cache busting
        run: |
          node tools/stamp.mjs


      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléversement de l'artefact Pages (Dossier app/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "app/"

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Synchronisation de la branche gh-pages (Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          force_orphan: true
